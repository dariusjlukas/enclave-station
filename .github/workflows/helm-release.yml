name: Helm Chart

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-release.yml"
  pull_request:
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-release.yml"

env:
  CHART_DIR: deploy/helm/enclave-station

jobs:
  # Lint + render the chart on every PR/push so template regressions are caught
  # before release. Renders both shipped presets (a render error fails the job).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: helm lint (production preset)
        run: helm lint "$CHART_DIR" -f "$CHART_DIR/ci/production-values.yaml"

      - name: helm lint (eval preset)
        run: helm lint "$CHART_DIR" -f "$CHART_DIR/ci/eval-values.yaml"

      - name: helm template (production preset)
        run: helm template rel "$CHART_DIR" -f "$CHART_DIR/ci/production-values.yaml" > /tmp/prod.yaml

      - name: helm template (eval preset)
        run: helm template rel "$CHART_DIR" -f "$CHART_DIR/ci/eval-values.yaml" > /tmp/eval.yaml

      - name: Validate rendered manifests against Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: -strict -ignore-missing-schemas -summary /tmp/prod.yaml /tmp/eval.yaml

  # On a version tag, package the chart (stamped with the tag version +
  # appVersion so its image refs resolve to the images published by
  # docker-publish.yml) and push it to the GHCR OCI registry.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: helm registry login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Package chart
        run: |
          helm package "$CHART_DIR" \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.version }}" \
            --destination /tmp/chart

      - name: Push chart to OCI registry
        run: |
          helm push /tmp/chart/enclave-station-${{ steps.ver.outputs.version }}.tgz \
            oci://ghcr.io/${{ github.repository }}/charts
