{{- if and (eq .Values.storage.backend "local") .Values.storage.local.persistence.enabled (not .Values.storage.local.persistence.existingClaim) -}}
{{/*
PersistentVolumeClaim for local-filesystem blob storage. With more than one
backend replica (or autoscaling), this MUST be a ReadWriteMany volume so all
pods share the same uploads directory — otherwise use storage.backend=s3.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "enclave.backend.fullname" . }}-uploads
  labels:
    {{- include "enclave.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  accessModes:
    - {{ .Values.storage.local.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.storage.local.persistence.size }}
  {{- if .Values.storage.local.persistence.storageClass }}
  storageClassName: {{ .Values.storage.local.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
