{{- if not .Values.auth.existingSecret -}}
{{/*
Chart-managed Secret. Holds every sensitive value the backend, migration Job,
and (eval) in-cluster Postgres consume. Skip this entirely (and reference your
own Secret with the same keys) by setting auth.existingSecret.

This is a pre-install/pre-upgrade hook at a LOWER weight (-20) than the Postgres
hook (-10) and the migration hook (0) so it exists before either consumes it —
otherwise those pre-install hooks fail with "secret not found" (normal resources
are created only after the pre-install hook phase). It is NOT deleted on success
(the backend reads it for the release's lifetime); before-hook-creation cleans
the prior copy on the next install/upgrade.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "enclave.fullname" . }}
  labels:
    {{- include "enclave.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  postgres-password: {{ required "postgresql.password is required (or set auth.existingSecret)" .Values.postgresql.password | quote }}
  redis-url: {{ include "enclave.redis.url" . | quote }}
  {{- if eq .Values.storage.backend "s3" }}
  s3-access-key: {{ .Values.storage.s3.accessKey | quote }}
  s3-secret-key: {{ .Values.storage.s3.secretKey | quote }}
  {{- else }}
  s3-access-key: ""
  s3-secret-key: ""
  {{- end }}
{{- end }}
