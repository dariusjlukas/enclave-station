{{- if .Values.redis.deploy -}}
{{/*
EVAL-ONLY in-cluster Redis for cross-instance WebSocket fan-out + the shared
auth rate-limiter. No persistence (pub/sub + ephemeral counters don't need it),
no auth. For production, run a managed/operated Redis and set redis.url instead
(it supports redis:// and rediss:// with user:pass@ — see
docs/ops/redis-pubsub.md).

Deployed as a normal resource (no hook): the backend tolerates a momentarily
unavailable Redis, and nothing in the pre-install phase depends on it.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "enclave.redis.fullname" . }}
  labels:
    {{- include "enclave.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    {{- include "enclave.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "enclave.redis.fullname" . }}
  labels:
    {{- include "enclave.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "enclave.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "enclave.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--appendonly", "no", "--save", ""]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
{{- end }}
