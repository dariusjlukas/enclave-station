apiVersion: v1
kind: Service
metadata:
  name: {{ include "enclave.frontend.fullname" . }}
  labels:
    {{- include "enclave.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "enclave.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
      protocol: TCP
